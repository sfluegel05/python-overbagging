[project]
name = "overbagging"
version = "0.1.0"
description = "Overbagging for hierarchical multi-label classification problems. Combines resampling with bagging and random oversampling."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "ruff>=0.6",
    "pytest>=8.0",
]

chebi = [
    "torch"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overbagging"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["overbagging", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["overbagging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
